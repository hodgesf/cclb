# A1: higher cosine floor. eta_min raised from 1e-6 to 1e-4 so late-epoch LR
# does not crater. Everything else identical to rdkg_masked_1e8.yaml.

output_dir: ~/experiments/
fast_test: 1000

dataset:
  class: RDKG
  path: /nfs/stak/users/hodgesf/data/splits_human

task:
  class: KnowledgeGraphCompletion
  model:
    class: MaskedNBFNet
    selector_dim: 32
    lambda_l1: 1.0e-8
    audit: yes
    input_dim: 32
    hidden_dims: [32,32,32,32,32,32]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    dependent: no
  criterion: bce
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  sample_weight: no
  full_batch_eval: yes

optimizer:
  class: Adam
  lr: 5.0e-4

scheduler:
  class: CosineAnnealingLR
  T_max: 10
  eta_min: 1.0e-4   # A1 change. was 1.0e-6.

engine:
  gpus: {{ gpus }}
  batch_size: 4
  log_interval: 10

train:
  num_epoch: 10
  batch_per_epoch: 500

metric: mrr
