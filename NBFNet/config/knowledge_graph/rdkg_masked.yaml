output_dir: ~/experiments/
fast_test: 1000

dataset:
  class: RDKG
  path: /home/hodgesf/Desktop/code/cclb/splits_human

task:
  class: KnowledgeGraphCompletion
  model:
    class: MaskedNBFNet
    selector_dim: 32
    k_start: 2000000
    k_end: 50000
    tau: 1.0
    audit: yes 
    input_dim: 16
    hidden_dims: [16, 16, 16, 16, 16, 16]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    dependent: no
  criterion: bce
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  sample_weight: no
  full_batch_eval: yes

optimizer:
  class: Adam
  lr: 5.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 8

train:
  num_epoch: 1
  batch_per_epoch: 20 

metric: mrr
