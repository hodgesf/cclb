
output_dir: ~/experiments/
fast_test: 1000

dataset: 
  class: RDKG
  path: /nfs/stak/users/hodgesf/data/splits_human 

task:
  class: KnowledgeGraphCompletion
  model:
    class: NBFNet
    input_dim: 32
    hidden_dims: [32,32,32,32,32,32]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    dependent: no 
  criterion: bce
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  sample_weight: no
  full_batch_eval: yes

optimizer: 
  class: Adam
  lr: 5.0e-4

engine: 
  gpus: {{ gpus }}
  batch_size: 4
  log_interval: 25 

train: 
  num_epoch: 4
  batch_per_epoch: 500

metric: mrr 
