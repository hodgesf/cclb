# A2: warm-restart cosine (SGDR). T_0=5, T_mult=1 gives two 5-epoch cycles
# across 10 epochs. LR resets to base at epoch 5, giving the selector a
# second high-LR window to flip mask edges.

output_dir: ~/experiments/
fast_test: 1000

dataset:
  class: RDKG
  path: /nfs/stak/users/hodgesf/data/splits_human

task:
  class: KnowledgeGraphCompletion
  model:
    class: MaskedNBFNet
    selector_dim: 32
    lambda_l1: 1.0e-8
    audit: yes
    input_dim: 32
    hidden_dims: [32,32,32,32,32,32]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    dependent: no
  criterion: bce
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  sample_weight: no
  full_batch_eval: yes

optimizer:
  class: Adam
  lr: 5.0e-4

scheduler:
  class: CosineAnnealingWarmRestarts   # A2 change. was CosineAnnealingLR.
  T_0: 5
  T_mult: 1
  eta_min: 1.0e-6

engine:
  gpus: {{ gpus }}
  batch_size: 4
  log_interval: 10

train:
  num_epoch: 10
  batch_per_epoch: 500

metric: mrr
