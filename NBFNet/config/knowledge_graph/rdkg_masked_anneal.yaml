# B4: L1 annealing. Lambda starts at 1e-7 through epoch 4, then decays
# linearly to 0 by epoch 9. The hypothesis is that the L1 anchors the
# selector at ~12 percent density once stable, blocking late-epoch
# refinement. Requires the run.py annealing hook.

output_dir: ~/experiments/
fast_test: 1000

dataset:
  class: RDKG
  path: /nfs/stak/users/hodgesf/data/splits_human

task:
  class: KnowledgeGraphCompletion
  model:
    class: MaskedNBFNet
    selector_dim: 32
    lambda_l1: 1.0e-7   # overwritten by schedule[0] at epoch 0
    audit: yes
    input_dim: 32
    hidden_dims: [32,32,32,32,32,32]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    dependent: no
  criterion: bce
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  sample_weight: no
  full_batch_eval: yes

optimizer:
  class: Adam
  lr: 5.0e-4

scheduler:
  class: CosineAnnealingLR
  T_max: 10
  eta_min: 1.0e-6

# B4 schedule. One value per epoch. run.py picks schedule[i] before each
# epoch and writes it to model.lambda_l1.
lambda_l1_schedule: [1.0e-7, 1.0e-7, 1.0e-7, 1.0e-7, 1.0e-7, 8.0e-8, 6.0e-8, 4.0e-8, 2.0e-8, 0.0]

engine:
  gpus: {{ gpus }}
  batch_size: 4
  log_interval: 10

train:
  num_epoch: 10
  batch_per_epoch: 500

metric: mrr
